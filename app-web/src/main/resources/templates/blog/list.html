<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(view=~{::content})}">
<head>
    <title>Blog</title>
</head>
<body>
<div th:fragment="content">
    <!-- Hero Section -->
    <section class="text-center mb-24">
        <div class="glassmorphism hero-glow rounded-3xl p-8 md:p-16">
            <h1 class="text-4xl md:text-6xl font-black text-white leading-tight mb-4">
                Our Blog
            </h1>
            <p class="text-lg md:text-xl max-w-3xl mx-auto text-gray-300 mb-8">
                Articles and updates on data engineering, Business Intelligence, Teradata, and the evolution of the Data Flow Visualizer tool.
            </p>
        </div>
    </section>

    <section id="news">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="glassmorphism rounded-2xl overflow-hidden group news-card" th:each="post : ${posts}">
                <div class="overflow-hidden">
                    <img src="https://placehold.co/600x400/0a0a0a/cyan?text=News" alt="News image" class="w-full h-48 object-cover transition-transform duration-300 news-image">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold mb-3" th:text="${post.title}">Version 1.0 Released</h3>
                    <div class="text-sm text-gray-400 mb-4">
                        <span>By <span th:text="${post.author}">Author</span></span> |
                        <span><span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}">Date</span></span>
                    </div>
                    <a th:href="@{'/blog/' + ${post.slug}}" class="font-semibold text-white hover:text-cyan-400">Read more &rarr;</a>
                </div>
            </div>
        </div>
        <div th:if="${posts.isEmpty()}" class="text-center py-10 glassmorphism rounded-2xl mt-8">
            <p class="text-gray-300 text-lg">No blog posts have been published yet. Check back soon!</p>
        </div>
    </section>
</div>
</body>
</html>
