<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(view=~{::content})}">
<head>
    <title>What's New</title>
</head>
<body>
<div th:fragment="content">
    <!-- Hero Section -->
    <section class="text-center mb-24">
        <div class="glassmorphism hero-glow rounded-3xl p-8 md:p-16">
            <h1 class="text-4xl md:text-6xl font-black text-white leading-tight mb-4">
                What's New
            </h1>
            <p class="text-lg md:text-xl max-w-3xl mx-auto text-gray-300 mb-8">
                Latest updates, features, and announcements for the Data Flow Visualizer tool.
            </p>
        </div>
    </section>

    <section id="whats-new" class="max-w-3xl mx-auto">
        <div class="space-y-8">
            <div class="glassmorphism rounded-xl p-6" th:each="item : ${whatsnews}">
                <h3 class="text-2xl font-bold mb-2" th:text="${item.title}"></h3>
                <div class="text-sm text-gray-400 mb-4">
                    <span>Published on <span th:text="${#temporals.format(item.createdAt, 'MMMM dd, yyyy')}">Date</span></span>
                </div>
                <div class="prose prose-invert max-w-none" th:utext="${item.content}"></div>
            </div>
        </div>
        <div th:if="${whatsnews.isEmpty()}" class="text-center py-10 glassmorphism rounded-2xl mt-8">
            <p class="text-gray-300 text-lg">No updates have been published yet. Check back soon!</p>
        </div>
    </section>
</div>
</body>
</html>
