<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's New - Data Flow Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glassmorphism {
            background: rgba(16, 16, 16, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased">
    <div id="particles-js"></div>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="pt-32 pb-16 px-4 max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center text-white mb-12">What's New</h1>
        <div class="space-y-8">
            <div th:each="item : ${whatsnews}" class="glassmorphism rounded-2xl p-6">
                <h2 class="text-2xl font-bold text-white mb-2" th:text="${item.title}"></h2>
                <div class="text-sm text-gray-400 mb-4">
                    <span>Published on <span th:text="${#temporals.format(item.createdAt, 'MMMM dd, yyyy')}">Date</span></span>
                </div>
                <div class="prose prose-invert max-w-none text-gray-300" th:utext="${item.content}"></div>
            </div>
            <div th:if="${whatsnews.isEmpty()}" class="text-center py-10">
                <p class="text-gray-400">No updates have been published yet. Check back soon!</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": { "number": { "value": 50, "density": { "enable": true, "value_area": 800 } }, "color": { "value": "#ffffff" }, "shape": { "type": "circle", }, "opacity": { "value": 0.2, "random": true, }, "size": { "value": 3, "random": true, }, "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 }, "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false, } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": false }, "resize": true }, "modes": { "repulse": { "distance": 100, "duration": 0.4 } } }, "retina_detect": true
        });
    </script>
</body>
</html>
