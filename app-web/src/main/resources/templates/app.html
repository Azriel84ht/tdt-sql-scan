<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>The App | Data Flow Visualizer</title>
    <link rel="icon" type="image/png" th:href="@{/main-images/icon_mini_100x100.png}" />
    <meta name="description" content="The application part of Data Flow Visualizer, a tool to visualize complex data flows from Teradata BTEQ scripts. Upload your files and see the magic." />
    <meta name="keywords" content="Data Flow, Visualizer, Teradata, BTEQ, SQL, ETL, Data Lineage, Application" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        .navigation-controls {
            padding: 10px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navigation-controls button {
            padding: 5px 10px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
        }
        .navigation-controls button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .navigation-controls #current-view-title {
            font-weight: bold;
        }
        .dark .navigation-controls {
            background-color: #1f2937;
            border-bottom-color: #4b5563;
        }
        .dark .navigation-controls button {
            background-color: #374151;
            border-color: #4b5563;
            color: #d1d5db;
        }
    </style>
</head>
<body class="dark:bg-gray-900">

<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <h1>Data Flow Visualizer for your Scripts</h1>

    <div id="upload-container">
        <div id="drop-zone" class="drop-zone">
            <p>Drag and drop your BTEQ files here, or click to select files.</p>
            <input type="file" id="file-input" multiple style="display: none;" />
        </div>
        <div id="file-list-container" style="display: none;">
            <h3>Selected Files:</h3>
            <form id="file-order-form">
                <ul id="file-list"></ul>
                <button type="submit">Upload and Visualize</button>
            </form>
        </div>
    </div>

    <div id="flow-container" style="display: none;">
        <div id="flow-main">
            <div id="navigation-controls" class="navigation-controls">
                <button id="home-button" disabled>Inicio</button>
                <button id="back-button" disabled>Atrás</button>
                <span id="current-view-title">Flujo de cadena</span>
            </div>

            <div id="chain-flow" class="tabcontent">
                <div id="chain-flow-network" style="width: 100%; border: 1px solid lightgray;"></div>
            </div>

            <div id="bteq-flow-container" class="tabcontent">
                <!-- BTEQ script tabs will be dynamically inserted here -->
            </div>
        </div>
        <div id="metadata-sidebar">
            <h2>Metadata</h2>
            <table id="metadata-table">
                <!-- Metadata will be inserted here -->
            </table>
        </div>
    </div>
</div>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <pre id="modal-text"></pre>
  </div>
</div>

<div id="context-menu">
    <a href="#" id="show-schema">Show schema</a>
    <a href="#" id="view-text">View Text</a>
    <a href="#" id="copy-code">Copy Code</a>
</div>

<script type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadContainer = document.getElementById('upload-container');
    const fileListContainer = document.getElementById('file-list-container');
    const fileList = document.getElementById('file-list');
    const fileOrderForm = document.getElementById('file-order-form');
    const flowContainer = document.getElementById('flow-container');
    const modal = document.getElementById("myModal");
    const modalText = document.getElementById("modal-text");
    const span = document.getElementsByClassName("close")[0];
    const contextMenu = document.getElementById('context-menu');
    let activeNode = null;
    let fileMetadata = {};
    let bteqFlowsData = {};
    let networks = {}; // Store network instances
    let graphData = {}; // Store original graph data for re-rendering
    let navigationStack = [];

    function navigateTo(viewId, viewTitle) {
        // Hide all views
        const allViews = document.querySelectorAll('.tabcontent');
        allViews.forEach(view => view.style.display = 'none');

        // Show the target view
        const targetView = document.getElementById(viewId);
        if (targetView) {
            targetView.style.display = 'block';
        }

        // Update title
        document.getElementById('current-view-title').textContent = viewTitle;

        // Update button states
        const homeButton = document.getElementById('home-button');
        const backButton = document.getElementById('back-button');

        if (navigationStack.length <= 1) {
            homeButton.disabled = true;
            backButton.disabled = true;
        } else {
            homeButton.disabled = false;
            backButton.disabled = false;
        }
    }

    span.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
        contextMenu.style.display = 'none';
    }

    document.getElementById('view-text').onclick = () => {
        if (activeNode && activeNode.fullText) {
            modalText.textContent = activeNode.fullText;
            modal.style.display = "block";
        }
    };

    document.getElementById('copy-code').onclick = () => {
        if (activeNode && activeNode.fullText) {
            navigator.clipboard.writeText(activeNode.fullText);
        }
    };

    document.getElementById('show-schema').onclick = () => {
        if (!activeNode || !activeNode.fileName) return;

        const scriptName = activeNode.fileName;
        const safeId = scriptName.replace(/[^a-zA-Z0-9]/g, '_');
        const viewId = `bteq-view-${safeId}`;
        const containerId = `bteq-graph-container-${safeId}`;

        // If the view container doesn't exist, create it.
        if (!document.getElementById(viewId)) {
            const flowMainContainer = document.getElementById('flow-main');
            const viewContent = document.createElement('div');
            viewContent.id = viewId;
            viewContent.className = 'tabcontent bteq-view';
            viewContent.style.display = 'none'; // Create it hidden

            const graphContainer = document.createElement('div');
            graphContainer.id = containerId;
            graphContainer.style.height = '800px';

            viewContent.appendChild(graphContainer);
            flowMainContainer.appendChild(viewContent);
        }

        // Now that the div is guaranteed to exist, navigate to it.
        const newView = { id: viewId, title: scriptName };
        navigationStack.push(newView);
        navigateTo(newView.id, newView.title); // This makes the div visible.

        // Now that the div is visible, render the graph if it hasn't been rendered before.
        if (!networks[containerId]) {
            const currentGraphData = bteqFlowsData[scriptName];
            if (!currentGraphData) {
                console.error('No graph data found for script:', scriptName);
                // Optionally navigate back if data is missing
                document.getElementById('back-button').click();
                return;
            }
            graphData[containerId] = currentGraphData;
            // Delay rendering to the next tick to ensure the container is ready
            setTimeout(() => {
                renderGraph(currentGraphData, document.getElementById(containerId), true);
            }, 0);
        }
    };

    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        selectedFiles = [...files];
        fileList.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${file.name}</span>
                <input type="number" class="file-order" value="${index + 1}" min="1" />
            `;
            fileList.appendChild(li);
        });
        fileListContainer.style.display = selectedFiles.length > 0 ? 'block' : 'none';
    }

    document.addEventListener("DOMContentLoaded", function() {
        navigationStack = [{ id: 'chain-flow', title: 'Flujo de cadena' }];
        navigateTo(navigationStack[0].id, navigationStack[0].title);
    });

    document.getElementById('home-button').addEventListener('click', () => {
        if (navigationStack.length > 1) {
            navigationStack = [{ id: 'chain-flow', title: 'Flujo de cadena' }];
            navigateTo(navigationStack[0].id, navigationStack[0].title);
        }
    });

    document.getElementById('back-button').addEventListener('click', () => {
        if (navigationStack.length > 1) {
            navigationStack.pop();
            const previousView = navigationStack[navigationStack.length - 1];
            navigateTo(previousView.id, previousView.title);
        }
    });

    fileOrderForm.addEventListener('submit', (event) => {
        event.preventDefault();

        uploadContainer.style.display = 'none';
        flowContainer.style.display = 'flex';

        const formData = new FormData();
        const fileOrder = [];
        const fileOrderInputs = document.querySelectorAll('.file-order');

        selectedFiles.forEach((file, index) => {
            formData.append('files', file);
            fileOrder.push({
                name: file.name,
                order: fileOrderInputs[index].value
            });
        });
        formData.append('fileOrder', JSON.stringify(fileOrder));


        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch('/upload', {
            method: 'POST',
            headers: {
                [header]: token
            },
            body: formData,
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error('Network response was not ok: ' + text) });
            }
            return response.json();
        })
        .then(data => {
            // Store data first
            fileMetadata = data.fileMetadata;
            graphData['chain-flow-network'] = data.chainFlow;
            bteqFlowsData = data.bteqFlows;

            // Clean up old views from previous uploads (if any)
            document.querySelectorAll('.bteq-view').forEach(view => view.remove());

            // Set the view to the main chain-flow, which makes its container visible
            navigationStack = [{ id: 'chain-flow', title: 'Flujo de cadena' }];
            navigateTo('chain-flow', 'Flujo de cadena');

            // NOW render the graph in the visible container
            const chainFlowContainer = document.getElementById('chain-flow-network');
            if (data.chainFlow) {
                renderGraph(data.chainFlow, chainFlowContainer, true);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while processing the file.');
        });
    });

    document.addEventListener('themeChanged', () => {
        for (const containerId in networks) {
            if (Object.hasOwnProperty.call(networks, containerId)) {
                const container = document.getElementById(containerId);
                const originalData = graphData[containerId];
                const enableContextMenu = containerId !== 'chain-flow-network';

                if (container && originalData) {
                    renderGraph(originalData, container, enableContextMenu);
                }
            }
        }
    });

    function renderGraph(data, container, enableContextMenu) {
        if (!data) {
            console.error("No data for graph rendering in container:", container.id);
            return;
        }

        const isDarkMode = document.documentElement.classList.contains('dark');

        const nodes = new vis.DataSet(
            data.nodes.map(node => {
                let nodeData = {
                    id: node.id,
                    label: node.label,
                    shape: node.properties.shape,
                    image: node.properties.image,
                    size: node.properties.size,
                    x: parseInt(node.properties.x),
                    y: parseInt(node.properties.y),
                    fullText: node.properties.fullText,
                    fixed: true,
                    fileName: node.properties.fileName,
                    fileSize: node.properties.fileSize,
                    fileEncoding: node.properties.fileEncoding,
                    noContextMenu: node.properties.noContextMenu,
                    font: node.properties.font || {} // Ensure font object exists
                };

                if (nodeData.image && nodeData.image.includes('bteq_script')) {
                    nodeData.shapeProperties = { useBorderWithImage: true };
                }

                if (isDarkMode) {
                    nodeData.font.color = '#d1d5db'; // Global dark mode font color for all nodes

                    if (nodeData.shape === 'image' || nodeData.shape === 'circularImage') {
                        // This is for the chain flow nodes
                        if (nodeData.shapeProperties?.useBorderWithImage) {
                            nodeData.color = {
                                background: '#1f2937', // Dark background behind the image
                                border: '#4b5563',
                                highlight: { background: '#374151', border: '#6b7280' },
                                hover: { background: '#374151', border: '#6b7280' }
                            };
                        }
                    } else {
                        // This is for other nodes (BTEQ flow)
                        nodeData.color = {
                            background: '#374151',
                            border: '#4b5563',
                            highlight: { background: '#4b5563', border: '#6b7280' },
                            hover: { background: '#4b5563', border: '#6b7280' }
                        };
                    }
                }
                return nodeData;
            })
        );

        const edges = new vis.DataSet(data.edges.map(edge => {
            let edgeData = { ...edge, width: 2, arrows: 'to' };
            if (isDarkMode) {
                edgeData.color = {
                    color: '#6b7280',
                    highlight: '#9ca3af',
                    hover: '#9ca3af'
                };
                edgeData.font = {
                    color: '#d1d5db'
                };
            }
            return edgeData;
        }));

        const networkData = {
            nodes: nodes,
            edges: edges,
        };
        const options = {
            nodes: {
                size: 25,
                font: {
                    size: 14,
                    face: 'arial'
                },
                shapeProperties: {
                    interpolation: false
                }
            },
            edges: {
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.5
                    }
                },
                smooth: {
                    type: 'dynamic'
                }
            },
            physics: {
                enabled: false
            }
        };
        const network = new vis.Network(container, networkData, options);
        networks[container.id] = network; // Store the network instance

        // Animate the camera to fit the whole graph, deferred to the next tick
        setTimeout(() => {
            network.fit({
                animation: {
                    duration: 1500,
                    easingFunction: 'easeInOutQuad'
                }
            });
        }, 0);


        network.on('beforeDrawing', function(ctx) {
            const canvasWidth = container.clientWidth;
            const canvasHeight = container.clientHeight;

            const viewCanvas = {
                topLeft: network.DOMtoCanvas({ x: 0, y: 0 }),
                bottomRight: network.DOMtoCanvas({ x: canvasWidth, y: canvasHeight })
            };

            if (data.horizontalLaneYs) {
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                data.horizontalLaneYs.forEach(laneY => {
                    ctx.beginPath();
                    ctx.moveTo(viewCanvas.topLeft.x, laneY);
                    ctx.lineTo(viewCanvas.bottomRight.x, laneY);
                    ctx.stroke();
                });
                ctx.setLineDash([]);
            }

            if (data.verticalLabelXs) {
                ctx.strokeStyle = '#ffc0cb';
                ctx.lineWidth = 2;
                data.verticalLabelXs.forEach(labelX => {
                    ctx.beginPath();
                    ctx.moveTo(labelX, viewCanvas.topLeft.y);
                    ctx.lineTo(labelX, viewCanvas.bottomRight.y);
                    ctx.stroke();
                });
            }
        });

        if (enableContextMenu) {
            network.on("oncontext", function (params) {
                params.event.preventDefault();
                const nodeId = network.getNodeAt(params.pointer.DOM);

                if (nodeId) {
                    activeNode = nodes.get(nodeId);

                    if (activeNode.noContextMenu) {
                        return;
                    }

                    const showSchemaLink = document.getElementById('show-schema');
                    const viewTextLink = document.getElementById('view-text');
                    const copyCodeLink = document.getElementById('copy-code');

                    // Hide all by default
                    showSchemaLink.style.display = 'none';
                    viewTextLink.style.display = 'none';
                    copyCodeLink.style.display = 'none';

                    let menuHasItems = false;

                    // Logic for BTEQ script nodes in Chain Flow
                    if (activeNode.image && activeNode.image.includes('bteq_script') && activeNode.fileName) {
                        showSchemaLink.style.display = 'block';
                        menuHasItems = true;
                    }

                    // Logic for nodes with text content (inside BTEQ graphs)
                    if (activeNode.fullText) {
                        viewTextLink.style.display = 'block';
                        copyCodeLink.style.display = 'block';
                        menuHasItems = true;
                    }

                    if (menuHasItems) {
                        contextMenu.style.left = params.event.pageX + 'px';
                        contextMenu.style.top = params.event.pageY + 'px';
                        contextMenu.style.display = 'block';
                    }
                }
            });
        }

        network.on("selectNode", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const clickedNode = nodes.get(nodeId);
                const table = document.getElementById('metadata-table');
                table.innerHTML = ""; // Clear previous metadata

                if (clickedNode && clickedNode.fileName) { // Check if it's a file node from the chain flow
                    const metadata = fileMetadata[clickedNode.fileName];
                    let tableHtml = `
                        <tr><th>Attribute</th><th>Value</th></tr>
                        <tr><td>File Name</td><td>${clickedNode.fileName}</td></tr>
                        <tr><td>File Size</td><td>${clickedNode.fileSize} bytes</td></tr>
                        <tr><td>Encoding</td><td>${clickedNode.fileEncoding}</td></tr>
                    `;

                    if (metadata) {
                        tableHtml += `
                            <tr><td>Transactions</td><td>${metadata.transactions}</td></tr>
                            <tr>
                                <td>Input Tables</td>
                                <td>${metadata.inputTables && metadata.inputTables.length > 0 ? metadata.inputTables.join('<br>') : '-'}</td>
                            </tr>
                            <tr>
                                <td>Output Tables</td>
                                <td>${metadata.outputTables && metadata.outputTables.length > 0 ? metadata.outputTables.join('<br>') : '-'}</td>
                            </tr>
                        `;
                    }
                    table.innerHTML = tableHtml;
                } else if (clickedNode && clickedNode.fullText) { // It's a command node in a BTEQ flow
                    table.innerHTML = `
                        <tr><th>Attribute</th><th>Value</th></tr>
                        <tr><td>Full Text</td><td><pre style="white-space: pre-wrap; word-wrap: break-word;">${clickedNode.fullText}</pre></td></tr>
                    `;
                }
            }
        });

        network.on("deselectNode", function (params) {
            document.getElementById('metadata-table').innerHTML = "";
        });
    }
    /*]]>*/
</script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
