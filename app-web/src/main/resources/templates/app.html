<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>The App | Data Flow Visualizer</title>
    <link rel="icon" type="image/png" th:href="@{/main-images/icon_mini_100x100.png}" />
    <meta name="description" content="The application part of Data Flow Visualizer, a tool to visualize complex data flows from Teradata BTEQ scripts. Upload your files and see the magic." />
    <meta name="keywords" content="Data Flow, Visualizer, Teradata, BTEQ, SQL, ETL, Data Lineage, Application" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="dark:bg-gray-900">

<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <h1>Data Flow Visualizer for your Scripts</h1>

    <div id="upload-container">
        <div id="drop-zone" class="drop-zone">
            <p>Drag and drop your BTEQ files here, or click to select files.</p>
            <input type="file" id="file-input" multiple style="display: none;" />
        </div>
        <div id="file-list-container" style="display: none;">
            <h3>Selected Files:</h3>
            <form id="file-order-form">
                <ul id="file-list"></ul>
                <button type="submit">Upload and Visualize</button>
            </form>
        </div>
    </div>

    <div id="flow-container" style="display: none;">
        <div id="flow-main">
            <div class="tab">
                <button class="tablinks" onclick="openTab(event, 'chain-flow')" id="defaultOpen">Flujo de cadena</button>
            </div>

            <div id="chain-flow" class="tabcontent">
                <div id="chain-flow-network" style="width: 100%; border: 1px solid lightgray;"></div>
            </div>

            <div id="bteq-flow-container" class="tabcontent">
                <!-- BTEQ script tabs will be dynamically inserted here -->
            </div>
        </div>
        <div id="metadata-sidebar">
            <h2>Metadata</h2>
            <table id="metadata-table">
                <!-- Metadata will be inserted here -->
            </table>
        </div>
    </div>
</div>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <pre id="modal-text"></pre>
  </div>
</div>

<div id="context-menu">
    <a href="#" id="view-text">View Text</a><br>
    <a href="#" id="copy-code">Copy Code</a>
</div>

<script type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    // Polyfill for roundRect
    if (typeof CanvasRenderingContext2D.prototype.roundRect === 'undefined') {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x+r, y);
            this.arcTo(x+w, y,   x+w, y+h, r);
            this.arcTo(x+w, y+h, x,   y+h, r);
            this.arcTo(x,   y+h, x,   y,   r);
            this.arcTo(x,   y,   x+w, y,   r);
            this.closePath();
            return this;
        }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadContainer = document.getElementById('upload-container');
    const fileListContainer = document.getElementById('file-list-container');
    const fileList = document.getElementById('file-list');
    const fileOrderForm = document.getElementById('file-order-form');
    const flowContainer = document.getElementById('flow-container');
    const tabContainer = document.querySelector('.tab');
    const container = document.getElementById('mynetwork');
    const modal = document.getElementById("myModal");
    const modalText = document.getElementById("modal-text");
    const span = document.getElementsByClassName("close")[0];
    const contextMenu = document.getElementById('context-menu');
    let activeNode = null;
    let fileMetadata = {};
    let networks = {}; // Store network instances
    let graphData = {}; // Store original graph data for re-rendering
    const bteqIcon = new Image();
    bteqIcon.src = '/images/bteq_script.png';
    const arrowIcon = new Image();
    arrowIcon.src = '/images/right_arrow.png';

    span.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
        contextMenu.style.display = 'none';
    }

    document.getElementById('view-text').onclick = () => {
        if (activeNode && activeNode.fullText) {
            modalText.textContent = activeNode.fullText;
            modal.style.display = "block";
        }
    };

    document.getElementById('copy-code').onclick = () => {
        if (activeNode && activeNode.fullText) {
            navigator.clipboard.writeText(activeNode.fullText);
        }
    };

    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        selectedFiles = [...files];
        fileList.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${file.name}</span>
                <input type="number" class="file-order" value="${index + 1}" min="1" />
            `;
            fileList.appendChild(li);
        });
        fileListContainer.style.display = selectedFiles.length > 0 ? 'block' : 'none';
    }

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        if (evt) {
            evt.currentTarget.className += " active";
        }

        const table = document.getElementById('metadata-table');
        table.innerHTML = "";
    }

    document.addEventListener("DOMContentLoaded", function() {
        openTab(null, 'chain-flow');
        document.querySelector('.tablinks').classList.add('active');
    });

    fileOrderForm.addEventListener('submit', (event) => {
        event.preventDefault();

        uploadContainer.style.display = 'none';
        flowContainer.style.display = 'flex';
        tabContainer.style.display = 'block';

        const formData = new FormData();
        const fileOrder = [];
        const fileOrderInputs = document.querySelectorAll('.file-order');

        selectedFiles.forEach((file, index) => {
            formData.append('files', file);
            fileOrder.push({
                name: file.name,
                order: fileOrderInputs[index].value
            });
        });
        formData.append('fileOrder', JSON.stringify(fileOrder));


        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch('/upload', {
            method: 'POST',
            headers: {
                [header]: token
            },
            body: formData,
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error('Network response was not ok: ' + text) });
            }
            return response.json();
        })
        .then(data => {
            fileMetadata = data.fileMetadata; // Store metadata
            graphData['chain-flow-network'] = data.chainFlow; // Store original data

            // Render Chain Flow graph
            const chainFlowContainer = document.getElementById('chain-flow-network');
            renderGraph(data.chainFlow, chainFlowContainer, false); // No context menu for chain flow

            // --- Render BTEQ Flow Graphs ---

            // 1. Clear previous BTEQ tabs and content
            const tabContainer = document.querySelector('.tab');
            document.querySelectorAll('.bteq-tab').forEach(tab => tab.remove());
            document.querySelectorAll('.bteq-tab-content').forEach(content => content.remove());

            // 2. Dynamically create tabs and containers for each BTEQ script
            const bteqFlows = data.bteqFlows;
            const flowMainContainer = document.getElementById('flow-main');
            let firstBteqTabButton = null;

            for (const scriptName in bteqFlows) {
                if (Object.hasOwnProperty.call(bteqFlows, scriptName)) {
                    const currentGraphData = bteqFlows[scriptName];

                    const safeId = scriptName.replace(/[^a-zA-Z0-9]/g, '_');
                    const tabId = `bteq-tab-content-${safeId}`;
                    const containerId = `bteq-graph-container-${safeId}`;

                    graphData[containerId] = currentGraphData; // Store original data

                    // Create the tab button
                    const tabButton = document.createElement('button');
                    tabButton.className = 'tablinks bteq-tab';
                    tabButton.textContent = scriptName;
                    tabButton.onclick = (event) => openTab(event, tabId);
                    tabContainer.appendChild(tabButton);

                    // Create the tab content pane
                    const tabContent = document.createElement('div');
                    tabContent.id = tabId;
                    tabContent.className = 'tabcontent bteq-tab-content';

                    // Create the actual div that will hold the graph
                    const graphContainer = document.createElement('div');
                    graphContainer.id = containerId;
                    graphContainer.style.height = '800px';

                    tabContent.appendChild(graphContainer);
                    flowMainContainer.appendChild(tabContent);

                    // Render the graph in the new container
                    renderGraph(currentGraphData, graphContainer, true); // Enable context menu for BTEQ flows

                    if (!firstBteqTabButton) {
                        firstBteqTabButton = tabButton;
                    }
                }
            }

            // 3. Open the first BTEQ tab by default if it exists
            if (firstBteqTabButton) {
                firstBteqTabButton.click();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while processing the file.');
        });
    });

    document.addEventListener('themeChanged', () => {
        for (const containerId in networks) {
            if (Object.hasOwnProperty.call(networks, containerId)) {
                const container = document.getElementById(containerId);
                const originalData = graphData[containerId];
                const enableContextMenu = containerId !== 'chain-flow-network';

                if (container && originalData) {
                    renderGraph(originalData, container, enableContextMenu);
                }
            }
        }
    });

    function renderGraph(data, container, enableContextMenu) {
        if (!data) {
            console.error("No data for graph rendering in container:", container.id);
            return;
        }

        const isDarkMode = document.documentElement.classList.contains('dark');

        const nodes = new vis.DataSet(
            data.nodes.map(node => {
                let nodeData = {
                    id: node.id,
                    label: node.label,
                    shape: node.properties.shape,
                    image: node.properties.image,
                    size: node.properties.size,
                    x: parseInt(node.properties.x),
                    y: parseInt(node.properties.y),
                    fullText: node.properties.fullText,
                    fixed: true,
                    fileName: node.properties.fileName,
                    fileSize: node.properties.fileSize,
                    fileEncoding: node.properties.fileEncoding,
                    font: node.properties.font || {} // Ensure font object exists
                };

                if (nodeData.shape === 'custom') {
                    nodeData.ctxRenderer = ({ ctx, id, x, y, state: { selected, hover }, style, label }) => {
                        const size = style.size || 25;
                        const isDarkMode = document.documentElement.classList.contains('dark');
                        const backgroundColor = isDarkMode ? '#1f2937' : '#ffffff';
                        const borderColor = isDarkMode ? '#4b5563' : '#dee2e6';
                        const textColor = isDarkMode ? '#d1d5db' : '#343434';
                        const nodeWidth = size * 2.5;
                        const nodeHeight = size * 1.5;

                        // Draw the background rectangle
                        ctx.beginPath();
                        ctx.fillStyle = backgroundColor;
                        ctx.strokeStyle = borderColor;
                        ctx.lineWidth = 1;
                        ctx.roundRect(x - nodeWidth / 2, y - nodeHeight / 2, nodeWidth, nodeHeight, 5);
                        ctx.fill();
                        ctx.stroke();

                        // Draw the image
                        const imgSize = size * 0.6;
                        let icon;
                        if (nodeData.image && nodeData.image.includes('bteq_script')) {
                            icon = bteqIcon;
                        } else if (nodeData.image && nodeData.image.includes('right_arrow')) {
                            icon = arrowIcon;
                        }

                        if (icon && icon.complete) {
                             ctx.drawImage(icon, x - imgSize / 2, y - nodeHeight / 2 + 5, imgSize, imgSize);
                        }


                        // Draw the label
                        if (label) {
                            const fontSize = style.font?.size || 12;
                            const fontFace = style.font?.face || 'Arial';
                            ctx.font = `${fontSize}px ${fontFace}`;
                            ctx.fillStyle = textColor;
                            ctx.textAlign = 'center';
                            ctx.fillText(label, x, y + nodeHeight / 2 - fontSize);
                        }
                    };
                } else if (isDarkMode) {
                    nodeData.font.color = '#d1d5db'; // Light gray for text
                    if (nodeData.shape !== 'image' && nodeData.shape !== 'circularImage') {
                        nodeData.color = {
                            background: '#374151', // Dark gray for node background
                            border: '#4b5563',     // Medium gray for border
                            highlight: {
                                background: '#4b5563',
                                border: '#6b7280'
                            },
                            hover: {
                                background: '#4b5563',
                                border: '#6b7280'
                            }
                        };
                    }
                }
                return nodeData;
            })
        );

        const edges = new vis.DataSet(data.edges.map(edge => {
            let edgeData = { ...edge, width: 2, arrows: 'to' };
            if (isDarkMode) {
                edgeData.color = {
                    color: '#6b7280',
                    highlight: '#9ca3af',
                    hover: '#9ca3af'
                };
                edgeData.font = {
                    color: '#d1d5db'
                };
            }
            return edgeData;
        }));

        const networkData = {
            nodes: nodes,
            edges: edges,
        };
        const options = {
            nodes: {
                size: 25,
                font: {
                    size: 14,
                    face: 'arial'
                },
                shapeProperties: {
                    interpolation: false
                }
            },
            edges: {
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.5
                    }
                },
                smooth: {
                    type: 'dynamic'
                }
            },
            physics: {
                enabled: false
            }
        };
        const network = new vis.Network(container, networkData, options);
        networks[container.id] = network; // Store the network instance
        network.on('beforeDrawing', function(ctx) {
            const canvasWidth = container.clientWidth;
            const canvasHeight = container.clientHeight;

            const viewCanvas = {
                topLeft: network.DOMtoCanvas({ x: 0, y: 0 }),
                bottomRight: network.DOMtoCanvas({ x: canvasWidth, y: canvasHeight })
            };

            if (data.horizontalLaneYs) {
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                data.horizontalLaneYs.forEach(laneY => {
                    ctx.beginPath();
                    ctx.moveTo(viewCanvas.topLeft.x, laneY);
                    ctx.lineTo(viewCanvas.bottomRight.x, laneY);
                    ctx.stroke();
                });
                ctx.setLineDash([]);
            }

            if (data.verticalLabelXs) {
                ctx.strokeStyle = '#ffc0cb';
                ctx.lineWidth = 2;
                data.verticalLabelXs.forEach(labelX => {
                    ctx.beginPath();
                    ctx.moveTo(labelX, viewCanvas.topLeft.y);
                    ctx.lineTo(labelX, viewCanvas.bottomRight.y);
                    ctx.stroke();
                });
            }
        });

        if (enableContextMenu) {
            network.on("oncontext", function (params) {
                params.event.preventDefault();
                const nodeId = network.getNodeAt(params.pointer.DOM);
                if (nodeId) {
                    activeNode = nodes.get(nodeId);
                    contextMenu.style.left = params.event.pageX + 'px';
                    contextMenu.style.top = params.event.pageY + 'px';
                    contextMenu.style.display = 'block';
                }
            });
        }

        network.on("selectNode", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const clickedNode = nodes.get(nodeId);
                if (clickedNode && clickedNode.fileName) { // Check if it's a file node
                    const metadata = fileMetadata[clickedNode.fileName];
                    const table = document.getElementById('metadata-table');
                    let tableHtml = `
                        <tr><th>Attribute</th><th>Value</th></tr>
                        <tr><td>File Name</td><td>${clickedNode.fileName}</td></tr>
                        <tr><td>File Size</td><td>${clickedNode.fileSize} bytes</td></tr>
                        <tr><td>Encoding</td><td>${clickedNode.fileEncoding}</td></tr>
                    `;

                    if (metadata) {
                        tableHtml += `
                            <tr><td>Transactions</td><td>${metadata.transactions}</td></tr>
                            <tr>
                                <td>Input Tables</td>
                                <td>${metadata.inputTables && metadata.inputTables.length > 0 ? metadata.inputTables.join('<br>') : '-'}</td>
                            </tr>
                            <tr>
                                <td>Output Tables</td>
                                <td>${metadata.outputTables && metadata.outputTables.length > 0 ? metadata.outputTables.join('<br>') : '-'}</td>
                            </tr>
                        `;
                    }
                    table.innerHTML = tableHtml;
                }
            }
        });

        network.on("deselectNode", function (params) {
            document.getElementById('metadata-table').innerHTML = "";
        });
    }
    /*]]>*/
</script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
