<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_management_layout}">
<head>
    <title>Create an Account</title>
</head>
<body>
<div layout:fragment="content" class="form-container">
    <h2>Create an Account</h2>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="alert alert--danger"></p>
        </div>

        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" required autofocus="autofocus" class="form-control" />
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" required class="form-control" />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" required class="form-control" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <div class="form-group">
            <label for="passwordConfirmation" class="form-label">Confirm Password</label>
            <input type="password" id="passwordConfirmation" name="passwordConfirmation" required class="form-control" />
            <span th:if="${#fields.hasErrors('global') and #strings.contains(#fields.errors('global'), 'Passwords do not match')}"
                  class="error">Passwords do not match</span>
        </div>
        <div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </div>
    </form>
    <p class="mt-3 text-center">
        Already have an account? <a th:href="@{/login}">Login</a>
    </p>
</div>
</body>
</html>
