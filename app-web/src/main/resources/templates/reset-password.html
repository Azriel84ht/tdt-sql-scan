<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_management_layout}">
<head>
    <title>Reset Password</title>
</head>
<body>
<div layout:fragment="content" class="form-container">
    <h2>Choose a New Password</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <div class="form-group">
            <label for="password" class="form-label">New Password:</label>
            <input type="password" id="password" name="password" required autofocus="autofocus" class="form-control"/>
        </div>
        <div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </div>
    </form>
</div>
</body>
</html>
