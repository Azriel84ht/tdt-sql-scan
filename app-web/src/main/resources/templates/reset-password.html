<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Data Flow Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glassmorphism {
            background: rgba(16, 16, 16, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-glow {
             box-shadow: 0 0 60px rgba(52, 144, 220, 0.25);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #21bded;
            box-shadow: 0 0 0 2px rgba(33, 189, 237, 0.5);
            outline: none;
        }
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body class="antialiased">
    <div id="particles-js"></div>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex items-center justify-center min-h-screen px-4">
        <div class="glassmorphism form-glow rounded-3xl p-8 md:p-12 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white">Choose a New Password</h1>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post" class="space-y-4">
                <input type="hidden" name="token" th:value="${token}" />
                <div>
                    <label for="password" class="text-sm font-medium text-gray-300">New Password</label>
                    <input type="password" id="password" name="password" required autofocus="autofocus" class="input-field mt-1 block w-full rounded-lg p-3 text-sm transition-all duration-300">
                </div>
                <div>
                    <label for="confirmPassword" class="text-sm font-medium text-gray-300">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required class="input-field mt-1 block w-full rounded-lg p-3 text-sm transition-all duration-300">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full px-8 py-3 font-semibold rounded-xl text-black bg-cyan-400 hover:bg-cyan-300 transition-all duration-300 transform hover:scale-105">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": { "number": { "value": 50, "density": { "enable": true, "value_area": 800 } }, "color": { "value": "#ffffff" }, "shape": { "type": "circle", }, "opacity": { "value": 0.2, "random": true, }, "size": { "value": 3, "random": true, }, "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 }, "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false, } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": false }, "resize": true }, "modes": { "repulse": { "distance": 100, "duration": 0.4 } } }, "retina_detect": true
        });
    </script>
</body>
</html>
