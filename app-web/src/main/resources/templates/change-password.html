<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_management_layout}">
<head>
    <title>Change Password</title>
</head>
<body>
<div layout:fragment="content" class="form-container">
    <h2>Please Update Your Password</h2>
    <p>For security reasons, you must change your temporary password before you can continue.</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/change-password}" method="post" class="w-full">
        <div class="form-group">
            <label for="password" class="form-label">New Password:</label>
            <input type="password" id="password" name="password" required autofocus="autofocus" class="form-control"/>
        </div>
        <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm New Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required class="form-control"/>
        </div>
        <div>
            <button type="submit" class="btn btn-primary w-100">Update Password</button>
        </div>
    </form>
    <p>
        <a th:href="@{/login}">Back to Login</a>
    </p>
</div>
</body>
</html>
