<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_management_layout}">
<head>
    <title>Forgot Password</title>
</head>
<body>
<div layout:fragment="content" class="form-container">
    <h2>Forgot Your Password?</h2>
    <p>Enter your email address and we will send you a link to reset your password.</p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" required autofocus="autofocus" class="form-control"/>
        </div>
        <div>
            <button type="submit" class="btn">Send Reset Link</button>
        </div>
    </form>
    <p>
        <a th:href="@{/login}">Back to Login</a>
    </p>
</div>
</body>
</html>
