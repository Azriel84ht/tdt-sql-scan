<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - What's New Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
<div th:replace="~{fragments/header :: header}"></div>
<div class="admin-wrapper">
    <nav class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
            <li><a th:href="@{/admin/users}">User Management</a></li>
            <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
            <li><a th:href="@{/admin/posts}">Blog Management</a></li>
            <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
            <li><a th:href="@{/admin/whats-new}" class="active">What's New Management</a></li>
            <li><a th:href="@{/app}">Back to App</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-actions">
            <h1>What's New</h1>
            <a th:href="@{/admin/whats-new/new}" class="btn btn-primary">Create New What's New</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="whatsnew : ${whatsnews}">
                <td th:text="${whatsnew.id}"></td>
                <td th:text="${whatsnew.title}"></td>
                <td th:text="${#temporals.format(whatsnew.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(whatsnew.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="action-links">
                    <a th:href="@{/admin/whats-new/edit/{id}(id=${whatsnew.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/whats-new/delete/{id}(id=${whatsnew.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this item?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
