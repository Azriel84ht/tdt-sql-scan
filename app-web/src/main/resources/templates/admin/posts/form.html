<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Manage Post</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <!-- TinyMCE Script -->
    <script th:src="@{'https://cdn.tiny.cloud/1/' + ${tinymceApiKey} + '/tinymce/6/tinymce.min.js'}" referrerpolicy="origin"></script>
    <script th:inline="javascript">
        function initTinyMCE() {
            const isDarkMode = document.documentElement.classList.contains('dark');
            tinymce.init({
                selector: 'textarea#content-editor',
                plugins: 'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
                menubar: 'file edit view insert format tools table help',
                toolbar: 'undo redo | bold italic underline strikethrough | fontfamily fontsize blocks | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview save print | insertfile image media template link anchor codesample | ltr rtl',
                autosave_ask_before_unload: true,
                autosave_interval: '30s',
                autosave_prefix: '{path}{query}-{id}-',
                autosave_restore_when_empty: false,
                autosave_retention: '2m',
                image_advtab: true,
                height: 600,
                skin: isDarkMode ? 'oxide-dark' : 'oxide',
                content_css: isDarkMode ? 'dark' : 'default'
            });
        }

        document.addEventListener('DOMContentLoaded', initTinyMCE);
        document.addEventListener('themeChanged', () => {
            if (tinymce.get('content-editor')) {
                tinymce.get('content-editor').remove();
            }
            initTinyMCE();
        });
    </script>
</head>
<body class="bg-white dark:bg-gray-900">
<div th:replace="~{fragments/header :: header}"></div>
<div class="admin-wrapper">
    <nav class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
            <li><a th:href="@{/admin/users}">User Management</a></li>
            <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
            <li><a th:href="@{/admin/posts}" class="active">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
            <li><a th:href="@{/app}">Back to App</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <h1 th:text="${post.id == null} ? 'Create New Post' : 'Edit Post'">Manage Post</h1>
        <form th:object="${post}" th:action="${post.id == null} ? @{/admin/posts} : @{/admin/posts/edit/{id}(id=${post.id})}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="content-editor">Content</label>
                <textarea id="content-editor" th:field="*{content}" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Post</button>
            <a th:href="@{/admin/posts}" class="btn btn-secondary">Cancel</a>
        </form>
    </main>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
