<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Blog Management</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
<div th:replace="~{fragments/header_app :: header}"></div>
<div class="admin-wrapper">
    <nav class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
            <li><a th:href="@{/admin/users}">User Management</a></li>
            <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
            <li><a th:href="@{/admin/posts}" class="active">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
            <li><a th:href="@{/app}">Back to App</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-actions">
            <h1>Blog Posts</h1>
            <a th:href="@{/admin/posts/new}" class="btn btn-primary">Create New Post</a>
        </div>

        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Impressions</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <td th:text="${post.title}"></td>
                <td th:text="${post.author}"></td>
                <td th:text="${post.impressions}"></td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="action-links">
                    <a th:href="@{/admin/posts/edit/{id}(id=${post.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this post?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
