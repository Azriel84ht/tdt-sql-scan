<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Blog Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f8f9fa; }
        .admin-wrapper { display: flex; }
        .sidebar { width: 250px; background-color: #343a40; color: white; min-height: 100vh; }
        .sidebar h2 { text-align: center; padding: 20px 0; margin: 0; background-color: #454d55; }
        .sidebar ul { list-style-type: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; color: #adb5bd; padding: 15px 20px; text-decoration: none; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #495057; color: white; }
        .main-content { flex-grow: 1; padding: 40px; }
        .main-content h1 { border-bottom: 2px solid #dee2e6; padding-bottom: 10px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th, .data-table td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        .data-table th { background-color: #e9ecef; font-weight: 600; }
        .data-table tbody tr:nth-child(odd) { background-color: #f8f9fa; }
        .data-table tbody tr:hover { background-color: #e2e6ea; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; color: white; }
        .btn-primary { background-color: #007bff; }
        .btn-danger { background-color: #dc3545; }
        .btn-sm { font-size: 0.875rem; padding: 5px 10px; }
        .action-links a { margin-right: 10px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <nav class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
            <li><a th:href="@{/admin/users}">User Management</a></li>
            <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
            <li><a th:href="@{/admin/posts}" class="active">Blog Management</a></li>
            <li><a th:href="@{/app}">Back to App</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-actions">
            <h1>Blog Posts</h1>
            <a th:href="@{/admin/posts/new}" class="btn btn-primary">Create New Post</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Impressions</th>
                <th>Created At</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <td th:text="${post.title}"></td>
                <td th:text="${post.author}"></td>
                <td th:text="${post.impressions}"></td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="action-links">
                    <a th:href="@{/admin/posts/edit/{id}(id=${post.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this post?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
