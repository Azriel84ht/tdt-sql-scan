<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a th:href="@{/admin}" class="active">Dashboard</a></li>
                <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
                <li><a th:href="@{/admin/users}">User Management</a></li>
                <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
                <li><a th:href="@{/admin/posts}">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
                <li><a th:href="@{/app}">Back to App</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>Dashboard</h1>
            <p>Welcome to the administration panel. Please select an option from the sidebar to get started.</p>
        </main>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
