<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar" class="w-64 h-screen glassmorphism p-4">
    <h2 class="text-xl font-bold mb-4">Admin Panel</h2>
    <ul>
        <li class="mb-2"><a th:href="@{/admin}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI() == '/admin' ? 'font-bold text-cyan-400' : ''}">Dashboard</a></li>
        <li class="mb-2"><a th:href="@{/admin/content}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI() == '/admin/content' ? 'font-bold text-cyan-400' : ''}">Manage Homepage</a></li>
        <li class="mb-2"><a th:href="@{/admin/users}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI() == '/admin/users' ? 'font-bold text-cyan-400' : ''}">User Management</a></li>
        <li class="mb-2"><a th:href="@{/admin/suggestions}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI() == '/admin/suggestions' ? 'font-bold text-cyan-400' : ''}">View Suggestions</a></li>
        <li class="mb-2"><a th:href="@{/admin/posts}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/admin/posts') ? 'font-bold text-cyan-400' : ''}">Blog Management</a></li>
        <li class="mb-2"><a th:href="@{/admin/faqs}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/admin/faqs') ? 'font-bold text-cyan-400' : ''}">FAQ Management</a></li>
        <li class="mb-2"><a th:href="@{/admin/whats-new}" class="block py-2 px-4 rounded-lg hover:bg-white/10" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/admin/whats-new') ? 'font-bold text-cyan-400' : ''}">What's New Management</a></li>
        <li class="mb-2"><a th:href="@{/app}" class="block py-2 px-4 rounded-lg hover:bg-white/10">Back to App</a></li>
    </ul>
</nav>
</body>
</html>
