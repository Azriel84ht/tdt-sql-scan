<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Suggestions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glassmorphism {
            background: rgba(16, 16, 16, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased">
    <div id="particles-js"></div>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="flex" style="padding-top: 80px;">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <main class="flex-1 p-8">
            <div class="glassmorphism rounded-2xl p-6">
                <h1 class="text-3xl font-bold text-white mb-6">User Suggestions</h1>
                <div th:if="${suggestions.isEmpty()}" class="text-center py-10">
                    <p class="text-gray-400">No suggestions have been submitted yet.</p>
                </div>
                <div class="space-y-6">
                    <div class="glassmorphism rounded-lg p-4" th:each="suggestion : ${suggestions}">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm text-gray-400">
                                    <strong>User:</strong> <span th:text="${suggestion.user.username}"></span> |
                                    <strong>Date:</strong> <span th:text="${#dates.format(suggestion.submissionDate, 'yyyy-MM-dd HH:mm')}"></span>
                                </p>
                                <p class="mt-2 text-gray-200" th:text="${suggestion.text}"></p>
                            </div>
                            <form th:action="@{/admin/suggestions/delete/{id}(id=${suggestion.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this suggestion?');">
                                <button type="submit" class="px-3 py-1 text-sm font-semibold rounded-lg text-white bg-red-600/50 hover:bg-red-600/80 transition-colors">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": { "number": { "value": 50, "density": { "enable": true, "value_area": 800 } }, "color": { "value": "#ffffff" }, "shape": { "type": "circle", }, "opacity": { "value": 0.2, "random": true, }, "size": { "value": 3, "random": true, }, "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 }, "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false, } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": false }, "resize": true }, "modes": { "repulse": { "distance": 100, "duration": 0.4 } } }, "retina_detect": true
        });
    </script>
</body>
</html>
