<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - View Suggestions</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="admin-wrapper">
        <nav class="admin-wrapper__sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a th:href="@{/admin}">Dashboard</a></li>
                <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
                <li><a th:href="@{/admin/users}">User Management</a></li>
                <li><a th:href="@{/admin/suggestions}" class="active">View Suggestions</a></li>
                <li><a th:href="@{/admin/posts}">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
                <li><a th:href="@{/app}">Back to App</a></li>
            </ul>
        </nav>
        <main class="admin-wrapper__main-content">
            <h1>User Suggestions</h1>

            <div th:if="${suggestions.isEmpty()}">
                <p>No suggestions have been submitted yet.</p>
            </div>

            <div class="suggestion-card" th:each="suggestion : ${suggestions}">
                <div class="suggestion-meta">
                    <div>
                        <strong>User:</strong> <span th:text="${suggestion.user.username}"></span> |
                        <strong>Date:</strong> <span th:text="${#dates.format(suggestion.submissionDate, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    <form th:action="@{/admin/suggestions/delete/{id}(id=${suggestion.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this suggestion?');">
                        <button type="submit" class="btn btn--danger btn--sm">Delete</button>
                    </form>
                </div>
                <p class="suggestion-text" th:text="${suggestion.text}"></p>
            </div>
        </main>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
