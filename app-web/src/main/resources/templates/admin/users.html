<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glassmorphism {
            background: rgba(16, 16, 16, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased">
    <div id="particles-js"></div>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="flex" style="padding-top: 80px;">
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <main class="flex-1 p-8">
            <div class="glassmorphism rounded-2xl p-6">
                <h1 class="text-3xl font-bold text-white mb-6">User Management</h1>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm text-left text-gray-400">
                        <thead class="text-xs text-gray-300 uppercase bg-white/5">
                            <tr>
                                <th scope="col" class="px-6 py-3">ID</th>
                                <th scope="col" class="px-6 py-3">Username</th>
                                <th scope="col" class="px-6 py-3">Email</th>
                                <th scope="col" class="px-6 py-3">Enabled</th>
                                <th scope="col" class="px-6 py-3">Roles</th>
                                <th scope="col" class="px-6 py-3">Registration Date</th>
                                <th scope="col" class="px-6 py-3">Last Login</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}" class="border-b border-white/10 hover:bg-white/5">
                                <td class="px-6 py-4" th:text="${user.id}"></td>
                                <td class="px-6 py-4 font-medium text-white" th:text="${user.username}"></td>
                                <td class="px-6 py-4" th:text="${user.email}"></td>
                                <td class="px-6 py-4">
                                    <span th:text="${user.enabled ? 'Yes' : 'No'}" th:class="${user.enabled ? 'text-green-400' : 'text-red-400'}"></span>
                                </td>
                                <td class="px-6 py-4" th:text="${user.roles}"></td>
                                <td class="px-6 py-4" th:text="${user.registrationDate != null ? #dates.format(user.registrationDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                                <td class="px-6 py-4" th:text="${user.lastLoginDate != null ? #dates.format(user.lastLoginDate, 'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": { "number": { "value": 50, "density": { "enable": true, "value_area": 800 } }, "color": { "value": "#ffffff" }, "shape": { "type": "circle", }, "opacity": { "value": 0.2, "random": true, }, "size": { "value": 3, "random": true, }, "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 }, "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false, } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": false }, "resize": true }, "modes": { "repulse": { "distance": 100, "duration": 0.4 } } }, "retina_detect": true
        });
    </script>
</body>
</html>
