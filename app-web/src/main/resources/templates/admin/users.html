<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - User Management</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a th:href="@{/admin}">Dashboard</a></li>
                <li><a th:href="@{/admin/users}" class="active">User Management</a></li>
                <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
                <li><a th:href="@{/admin/posts}">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
                <li><a th:href="@{/app}">Back to App</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>User Management</h1>
            <table class="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Enabled</th>
                        <th>Roles</th>
                        <th>Registration Date</th>
                        <th>Last Login</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.enabled}"></td>
                        <td th:text="${user.roles}"></td>
                        <td th:text="${user.registrationDate != null ? #dates.format(user.registrationDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                        <td th:text="${user.lastLoginDate != null ? #dates.format(user.lastLoginDate, 'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
