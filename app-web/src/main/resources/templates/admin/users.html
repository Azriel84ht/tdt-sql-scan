<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - User Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f8f9fa; }
        .admin-wrapper { display: flex; }
        .sidebar { width: 250px; background-color: #343a40; color: white; min-height: 100vh; }
        .sidebar h2 { text-align: center; padding: 20px 0; margin: 0; background-color: #454d55; }
        .sidebar ul { list-style-type: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; color: #adb5bd; padding: 15px 20px; text-decoration: none; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #495057; color: white; }
        .main-content { flex-grow: 1; padding: 40px; }
        .main-content h1 { border-bottom: 2px solid #dee2e6; padding-bottom: 10px; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .user-table th, .user-table td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        .user-table th { background-color: #e9ecef; font-weight: 600; }
        .user-table tbody tr:nth-child(odd) { background-color: #f8f9fa; }
        .user-table tbody tr:hover { background-color: #e2e6ea; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a th:href="@{/admin}">Dashboard</a></li>
                <li><a th:href="@{/admin/content}">Manage Homepage</a></li>
                <li><a th:href="@{/admin/users}" class="active">User Management</a></li>
                <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
                <li><a th:href="@{/admin/posts}">Blog Management</a></li>
                <li><a th:href="@{/app}">Back to App</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>User Management</h1>

            <table class="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Enabled</th>
                        <th>Roles</th>
                        <th>Registration Date</th>
                        <th>Last Login</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.enabled}"></td>
                        <td th:text="${user.roles}"></td>
                        <td th:text="${user.registrationDate != null ? #dates.format(user.registrationDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                        <td th:text="${user.lastLoginDate != null ? #dates.format(user.lastLoginDate, 'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
