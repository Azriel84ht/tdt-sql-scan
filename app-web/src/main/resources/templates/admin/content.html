<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Manage Homepage</title>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body class="bg-white dark:bg-gray-900">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="admin-wrapper">
        <nav class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a th:href="@{/admin}">Dashboard</a></li>
                <li><a th:href="@{/admin/content}" class="active">Manage Homepage</a></li>
                <li><a th:href="@{/admin/users}">User Management</a></li>
                <li><a th:href="@{/admin/suggestions}">View Suggestions</a></li>
                <li><a th:href="@{/admin/posts}">Blog Management</a></li>
                <li><a th:href="@{/admin/faqs}">FAQ Management</a></li>
                <li><a th:href="@{/admin/whats-new}">What's New Management</a></li>
                <li><a th:href="@{/app}">Back to App</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>Manage Homepage Content</h1>

            <div th:if="${message}" class="alert-success" th:text="${message}"></div>

            <form th:action="@{/admin/content}" th:object="${content}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="form-group">
                    <label for="heroTitle">Hero Title</label>
                    <input type="text" id="heroTitle" th:field="*{heroTitle}" />
                </div>
                <div class="form-group">
                    <label for="heroSubtitle">Hero Subtitle</label>
                    <textarea id="heroSubtitle" th:field="*{heroSubtitle}"></textarea>
                </div>
                <div class="form-group">
                    <label for="newsSection">News Section (HTML allowed)</label>
                    <textarea id="newsSection" th:field="*{newsSection}"></textarea>
                </div>
                <div class="form-group">
                    <label for="popupMessage">Popup Message</label>
                    <input type="text" id="popupMessage" th:field="*{popupMessage}" />
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" th:field="*{showPopup}" />
                        Show Popup on Homepage
                    </label>
                </div>
                <button type="submit" class="btn-primary">Save Content</button>
            </form>
        </main>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
