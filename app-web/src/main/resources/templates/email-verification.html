<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Email Verification</title>
</head>
<body>
    <p>Hello, <span th:text="${userName}">User</span>!</p>
    <p>Welcome to <span th:text="${appName}"></span>. Please click the link below to verify your email address:</p>
    <p><a th:href="${confirmationUrl}" th:text="${confirmationUrl}">Verification Link</a></p>
    <p>Thanks,<br/>The <span th:text="${appName}"></span> Team</p>
</body>
</html>
