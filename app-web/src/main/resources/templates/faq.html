<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/content-layout}">

<head>
    <title>FAQ | Data Flow Visualizer</title>
    <th:block layout:fragment="head">
        <style>
            .faq-item {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px;
                margin-bottom: 1rem;
                overflow: hidden;
            }
            .faq-question {
                width: 100%;
                text-align: left;
                padding: 1.5rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: white;
            }
            .faq-answer {
                padding: 0 1.5rem 1.5rem 1.5rem;
                display: none;
                color: #e2e8f0;
            }
        </style>
    </th:block>
</head>

<body>

<h1 layout:fragment="title">Frequently Asked Questions</h1>

<nav layout:fragment="breadcrumbs" aria-label="Breadcrumb">
    <ol>
        <li><a th:href="@{/}">Home</a></li>
        <li><span>FAQ</span></li>
    </ol>
</nav>

<div layout:fragment="content">
    <div class="accordion">
        <details th:each="faq : ${faqs}" class="faq-item">
            <summary class="faq-question" th:text="${faq.question}"></summary>
            <div class="faq-answer prose prose-invert max-w-none" th:utext="${faq.answer}">
            </div>
        </details>

        <div th:if="${faqs.isEmpty()}" class="text-center py-10">
            <p class="text-gray-400">No FAQs have been published yet. Check back soon!</p>
        </div>
    </div>
    <script>
        document.querySelectorAll('.faq-question').forEach(button => {
            button.addEventListener('click', () => {
                const answer = button.nextElementSibling;
                // Simple toggle for the accordion content
                if (answer.style.display === 'block') {
                    answer.style.display = 'none';
                } else {
                    // Hide other open answers
                    document.querySelectorAll('.faq-answer').forEach(ans => {
                        ans.style.display = 'none';
                    });
                    answer.style.display = 'block';
                }
            });
        });
    </script>
</div>

</body>
</html>
