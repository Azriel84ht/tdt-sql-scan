<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      class="dark">
<head>
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Data Flow Visualizer</title>
    <meta name="description" content="Visualize complex Teradata BTEQ scripts instantly. Our tool transforms convoluted SQL into clear, interactive data flow diagrams to untangle your ETL processes." />
    <meta name="keywords" content="Data Flow, Visualizer, Teradata, BTEQ, SQL, ETL, Data Lineage, Stitch Design" />
    <link rel="icon" type="image/png" th:href="@{/main-images/icon_full_200x200.png}" />

    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
            rel="stylesheet"
            as="style"
            onload="this.rel='stylesheet'"
            href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
    <style>
        .title-banner {
            background: rgba(30, 41, 59, 0.6); /* slate-800 with 60% opacity */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem 2rem;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .title-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent,
                rgba(0, 255, 255, 0.3), /* Adjusted cyan glow */
                transparent 30%
            );
            animation: rotate 6s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .title-banner h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #f0f8ff; /* AliceBlue for soft white */
        }
    </style>
    <!-- Page-specific head elements -->
    <th:block layout:fragment="head"></th:block>
</head>
<body style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
    <canvas class="background"></canvas>
    <div class="layout-container flex h-full grow flex-col">
        <!-- Conditional Header -->
        <div th:replace="~{fragments/header_guest :: header_guest}" sec:authorize="!isAuthenticated()"></div>
        <div th:replace="~{fragments/header_authenticated :: header_authenticated}" sec:authorize="isAuthenticated()"></div>

        <main class="section">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Title Banner -->
                <div class="title-banner">
                    <h1 layout:fragment="title">Default Title</h1>
                </div>

                <!-- Breadcrumbs -->
                <nav class="breadcrumbs" aria-label="Breadcrumb" layout:fragment="breadcrumbs">
                    <!-- Breadcrumb content will be injected here -->
                </nav>

                <!-- Main Content -->
                <div layout:fragment="content">
                    <p>This is the default content.</p>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/particlesjs/2.2.3/particles.min.js"></script>
<script th:src="@{/js/particles-config.js}"></script>
<!-- Conditional Scripts -->
<script th:src="@{/js/header.js}" sec:authorize="!isAuthenticated()"></script>
<script th:src="@{/js/header_authenticated.js}" sec:authorize="isAuthenticated()"></script>
</body>
</html>
