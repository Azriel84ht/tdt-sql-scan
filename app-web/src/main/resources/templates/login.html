<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_management_layout}">
<head>
    <title>Login</title>
</head>
<body>
<div layout:fragment="content" class="form-container">
    <h2>Login</h2>
    <div th:if="${param.error}" class="alert alert--danger">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert--info">
        You have been logged out.
    </div>
    <div th:if="${param.verified == 'true'}" class="alert alert--success">
        Your account has been successfully verified. Please log in.
    </div>
    <div th:if="${param.verified == 'false'}" class="alert alert--danger">
        There was an error during your account verification. Please contact support or try registering again.
    </div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username:</label>
            <input type="text" id="username" name="username" autofocus="autofocus" class="form-control"/>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" class="form-control"/>
        </div>
        <div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </div>
    </form>
    <p class="mt-3 text-center">
        No account yet? <a th:href="@{/register}">Create an account</a>
    </p>
    <p class="text-center">
        <a th:href="@{/forgot-password}">Forgot Password?</a>
    </p>
</div>
</body>
</html>
